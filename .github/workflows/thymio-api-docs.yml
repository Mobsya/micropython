name: Thymio API documentation

on:
  push:
    branches: [thymio3]
    paths:
      - "ports/esp32/**"
      - "tools/gen_api_docs.py"
      - ".github/workflows/thymio-api-docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Native libraries needed by WeasyPrint to render the PDF.
      - name: Install the PDF dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libcairo2
          pip install weasyprint

      - name: Build the API reference
        run: python tools/gen_api_docs.py ports/esp32 -o site --pdf

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
